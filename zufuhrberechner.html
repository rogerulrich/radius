<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zufuhrberechner Stationär – ASM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  --blue-dark: #3a5262;   /* Pantone 7699 U dunkel */
  --blue-mid:  #5e7688;   /* Pantone 7699 U */
  --blue-light:#dce5ea;   /* Pantone 7699 U hell */
  --teal:      #6b8a80;   /* Pantone 5585 U dunkel */
  --sand:      #9a7860;   /* Pantone 4675 U dunkel */
  --yellow:    #efda8f;   /* Pantone 4001 U */
  --rose:      #e6c6c7;   /* Pantone 5035 U */
  --warmgrey:  #dcd7d2;   /* Pantone 7527 U */
  --orange:    #8a6a50;
  --indigo:    #3a5262;
  --violet:    #5e7688;
  --green:     #4a7060;
  --red:       #8a3a3a;
}
body { background:#f0f4f8; font-size:0.875rem; }

/* ── SUMMARY BAR ── */
.summary-bar {
  position:sticky; top:0; z-index:200;
  background:var(--blue-dark); color:#fff;
  padding:8px 16px; box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.meal-block .lbl { font-size:0.7rem; opacity:.8; text-transform:uppercase; letter-spacing:.04em; }
.meal-block { text-align:center; }
.meal-block .lbl { font-size:0.7rem; opacity:.75; text-transform:uppercase; letter-spacing:.04em; }
.meal-block .val { font-size:1.05rem; font-weight:700; line-height:1.2; }
.meal-block .sub { font-size:0.7rem; opacity:.8; }
.divider { width:1px; background:rgba(255,255,255,.2); }

/* ── TABS ── */
.meal-tabs { position:sticky; top:58px; z-index:190; background:#fff;
  border-bottom:2px solid var(--blue-light); }
.meal-tabs .nav-link {
  color:var(--blue-dark); font-weight:600; padding:9px 18px;
  border:none; border-radius:0; position:relative;
}
.meal-tabs .nav-link.active {
  color:#fff; background:var(--blue-dark);
}
.meal-tabs .nav-link .badge-cnt {
  font-size:0.65rem; background:#fde68a; color:#92400e;
  border-radius:10px; padding:1px 6px; margin-left:5px;
}
.meal-tabs .nav-link.active .badge-cnt { background:rgba(255,255,255,.25); color:#fff; }

/* ── OVERVIEW ── */
.overview-col { background:#fff; border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08); }
.overview-header {
  background:var(--blue-mid); color:#fff;
  padding:8px 14px; border-radius:8px 8px 0 0;
  font-weight:700; font-size:0.9rem;
}
.ov-item { padding:4px 12px; border-bottom:1px solid #f0f4f8;
  display:flex; justify-content:space-between; align-items:center; }
.ov-item:last-child { border-bottom:none; }
.ov-item .ov-name { color:#374151; }
.ov-item .ov-kcal { font-size:0.75rem; color:var(--orange); white-space:nowrap; margin-left:8px; }
.ov-item .ov-qty  { font-size:0.75rem; color:#6b7280; margin-left:4px; }
.overview-total {
  background:var(--blue-light); padding:7px 12px;
  border-radius:0 0 8px 8px; display:flex; gap:12px;
  font-size:0.8rem; font-weight:600; color:var(--blue-dark);
}
.empty-meal { padding:18px 12px; color:#9ca3af; font-size:0.82rem; text-align:center; }

/* ── FOOD LIST ── */
.category-header {
  background:var(--blue-mid); color:#fff;
  padding:6px 13px; cursor:pointer; border-radius:6px;
  margin-bottom:2px; display:flex; justify-content:space-between;
  align-items:center; font-weight:600; font-size:0.87rem;
  user-select:none; letter-spacing:.01em;
}
.category-header:hover { background:var(--blue-dark); }
.item-table { width:100%; border-collapse:collapse; }
.item-table thead th {
  background:var(--warmgrey); color:var(--blue-dark);
  padding:5px 7px; font-size:0.77rem;
  position:sticky; top:102px; z-index:5;
}
.item-table tbody tr:hover { background:#f0f7ff; }
.item-table td { padding:3px 7px; border-bottom:1px solid #e9ecef; vertical-align:middle; }
.item-table tr.sel-row { background:#dce5ea !important; }
.item-table tr.neu-item td:first-child { border-left:3px solid #c8a870; }
.neu-badge { background:var(--yellow); color:#5a4010; font-size:0.62rem;
  padding:1px 4px; border-radius:3px; margin-left:4px; font-weight:700; }
.qty-ctrl { display:flex; align-items:center; gap:3px; }
.qty-btn { width:20px; height:20px; border:1px solid var(--blue-mid);
  background:var(--blue-light); border-radius:3px; cursor:pointer;
  font-weight:700; color:var(--blue-dark); font-size:0.8rem; line-height:1; }
.qty-btn:hover { background:#dbeafe; }
.qty-val { width:42px; text-align:center; font-weight:600; font-size:0.85rem;
  border:1px solid var(--blue-mid); border-radius:4px; padding:1px 3px; background:#f8fafa; }
.kcal-col { color:var(--sand); font-weight:600; }
.prot-col { color:var(--blue-dark); font-weight:600; }
.kh-col   { color:var(--teal); }

/* ── BUTTONS ── */
.btn-export { background:var(--teal); color:#fff; border:none; font-weight:600; }
.btn-export:hover { background:#4a6a60; color:#fff; }
.btn-clear { background:var(--sand); color:#fff; border:none; }
.btn-clear:hover { background:#7a5840; color:#fff; }
.btn-clear-meal { font-size:0.72rem; padding:2px 8px; border:1px solid var(--sand);
  color:var(--sand); background:#fff; border-radius:4px; }
.btn-clear-meal:hover { background:var(--warmgrey); }

/* ── PATIENT BAR ── */
.patient-bar {
  background:#fff; border-bottom:1px solid #dce6f5;
  padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
}
.patient-bar label { font-size:0.7rem; color:#6b7280; display:block; margin-bottom:2px; font-weight:600; }
.patient-bar input, .patient-bar select {
  font-size:0.82rem; padding:3px 7px; border:1px solid #d1d5db;
  border-radius:5px; background:#f9fafb; color:#111827;
}
.patient-bar input:focus, .patient-bar select:focus {
  outline:none; border-color:#2563a8; background:#fff;
}
.target-group { display:flex; align-items:center; gap:5px; }
.target-group input { width:72px; }
.target-group .unit { font-size:0.78rem; color:#6b7280; }

/* ── PROGRESS ── */
.prog-wrap { display:flex; align-items:center; gap:4px; }
.prog-bar-outer { height:5px; border-radius:3px; background:rgba(255,255,255,.25); width:70px; overflow:hidden; }
.prog-bar-inner { height:100%; border-radius:3px; transition:width .3s; }
.prog-pct { font-size:0.68rem; opacity:.85; min-width:32px; }

/* ── MISC ── */
#searchInput { max-width:300px; }
.accordion-body { padding:0; }
.tab-pane { padding:12px 0 0; }
</style>
</head>
<body>

<!-- ════════════ SUMMARY BAR ════════════ -->
<div class="summary-bar">
  <div class="container-fluid px-2">
    <div class="row align-items-center g-1">
      <div class="col-auto me-2">
        <div style="font-size:0.75rem;opacity:.7">Zufuhrberechner</div>

      </div>
      <div class="col">
        <div class="row g-0 justify-content-start">
          <div class="col-auto px-3 meal-block">
            <div class="lbl" style="color:#efda8f">Frühstück</div>
            <div class="val" id="s0_kcal">0 kcal</div>
            <div class="sub"><span id="s0_p">0g</span> P &nbsp;·&nbsp; <span id="s0_kh">0g</span> KH</div>
          </div>
          <div class="divider mx-1"></div>
          <div class="col-auto px-3 meal-block">
            <div class="lbl" style="color:#a2b9af">Mittagessen</div>
            <div class="val" id="s1_kcal">0 kcal</div>
            <div class="sub"><span id="s1_p">0g</span> P &nbsp;·&nbsp; <span id="s1_kh">0g</span> KH</div>
          </div>
          <div class="divider mx-1"></div>
          <div class="col-auto px-3 meal-block">
            <div class="lbl" style="color:#dab9a1">Abendessen</div>
            <div class="val" id="s2_kcal">0 kcal</div>
            <div class="sub"><span id="s2_p">0g</span> P &nbsp;·&nbsp; <span id="s2_kh">0g</span> KH</div>
          </div>
          <div class="divider mx-1"></div>
          <div class="col-auto px-3 meal-block">
            <div class="lbl">Gesamt</div>
            <div class="val" id="sg_kcal">0 kcal</div>
            <div class="sub"><span id="sg_p">0g</span> P &nbsp;·&nbsp; <span id="sg_kh">0g</span> KH</div>
          </div>
          <div class="divider mx-1"></div>
          <div class="col-auto px-3">
            <div class="lbl">Ziel Energie</div>
            <div class="prog-wrap">
              <div class="prog-bar-outer"><div class="prog-bar-inner" id="pb_kcal" style="width:0%;background:#fde68a"></div></div>
              <span class="prog-pct" id="pct_kcal">—</span>
            </div>
            <div class="lbl mt-1">Ziel Protein</div>
            <div class="prog-wrap">
              <div class="prog-bar-outer"><div class="prog-bar-inner" id="pb_p" style="width:0%;background:#93c5fd"></div></div>
              <span class="prog-pct" id="pct_p">—</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-auto d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-export" onclick="exportPDF()">📄 PDF Export</button>
        <button class="btn btn-sm btn-clear" onclick="clearAllMeals()">✕ Alles leeren</button>
      </div>
    </div>
  </div>
</div>

<!-- ════════════ PATIENT BAR ════════════ -->
<div class="patient-bar">
  <div>
    <label>Vorname</label>
    <input type="text" id="pat_vorname" placeholder="Vorname" style="width:110px">
  </div>
  <div>
    <label>Nachname</label>
    <input type="text" id="pat_nachname" placeholder="Nachname" style="width:120px">
  </div>
  <div>
    <label>Geburtsdatum</label>
    <input type="date" id="pat_geburt" style="width:135px">
  </div>
  <div>
    <label>Kostform</label>
    <select id="pat_kostform" style="width:180px">
      <option value="">— bitte wählen —</option>
      <option>Vollkost</option>
      <option>Leichte Vollkost</option>
      <option>Weiche Kost</option>
      <option>Pürierte Kost</option>
      <option>Breiige Kost</option>
      <option>Flüssige Kost</option>
      <option>Hochkalorische Kost</option>
      <option>Energiereduzierte Kost</option>
      <option>Eiweissreiche Kost</option>
      <option>Diabeteskost</option>
      <option>Glutenfreie Kost</option>
      <option>Laktosefreie Kost</option>
      <option>Natriumarme Kost</option>
      <option>Vegetarisch</option>
      <option>Vegan</option>
      <option>Halal</option>
    </select>
  </div>
  <div class="target-group">
    <div>
      <label>Ziel Energie</label>
      <input type="number" id="ziel_kcal" placeholder="kcal" min="0" max="5000"
        oninput="updateAll()" style="width:72px">
    </div>
    <span class="unit" style="padding-bottom:2px">kcal</span>
  </div>
  <div class="target-group">
    <div>
      <label>Ziel Protein</label>
      <input type="number" id="ziel_prot" placeholder="g" min="0" max="300"
        oninput="updateAll()" style="width:64px">
    </div>
    <span class="unit" style="padding-bottom:2px">g</span>
  </div>
</div>

<!-- ════════════ MAIN ════════════ -->
<div class="container-fluid px-3 py-2">

  <div class="meal-tabs">
    <ul class="nav" id="mealTabs">
      <li class="nav-item">

      </li>

      <div id="accordionWrap"></div>

            <div id="ov2"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const MEAL_NAMES = ['Frühstück', 'Mittagessen', 'Abendessen'];
// selections[meal][foodIdx] = qty (0 = not selected)
const selections = [
  new Array(FOOD_DATA.length).fill(0),
  new Array(FOOD_DATA.length).fill(0),
  new Array(FOOD_DATA.length).fill(0),
];
let activeMeal = 0; // 0,1,2 = meal tabs; 3 = overview

const CATEGORIES = [...new Set(FOOD_DATA.map(f => f.cat))];

// ═══════════════════════════════════════════
// ACCORDION BUILD
// ═══════════════════════════════════════════
function buildAccordion() {
  const wrap = document.getElementById('accordionWrap');
  wrap.innerHTML = '';
  CATEGORIES.forEach((cat, ci) => {
    const items = FOOD_DATA.map((f, i) => ({...f, idx: i})).filter(f => f.cat === cat);
    const div = document.createElement('div');
    div.className = 'mb-2';
    div.setAttribute('data-cat-block', ci);
    div.innerHTML = `
      <div class="category-header" onclick="toggleCat(${ci})">
        <span>${cat} <span class="badge bg-white text-secondary ms-1" style="font-size:0.68rem">${items.length}</span></span>
        <span id="catarrow${ci}">▼</span>
      </div>
      <div id="catbody${ci}" style="display:block">
        <table class="item-table">
          <thead>
            <tr>
              <th style="width:28px"></th>
              <th>Speise</th>
              <th style="width:68px">Portion</th>
              <th style="width:55px" class="kcal-col">kcal</th>
              <th style="width:60px" class="prot-col">Protein</th>
              <th style="width:52px" class="kh-col">KH</th>
              <th style="width:78px">Anzahl</th>
            </tr>
          </thead>
          <tbody id="catrows${ci}"></tbody>
        </table>
      </div>`;
    wrap.appendChild(div);
  });
  renderRows();
}

function toggleCat(ci) {
  const body = document.getElementById(`catbody${ci}`);
  const arrow = document.getElementById(`catarrow${ci}`);
  if (body.style.display === 'none') {
    body.style.display = 'block'; arrow.textContent = '▼';
  } else {
    body.style.display = 'none'; arrow.textContent = '▶';
  }
}

function renderRows() {
  const m = activeMeal;
  CATEGORIES.forEach((cat, ci) => {
    const tbody = document.getElementById(`catrows${ci}`);
    if (!tbody) return;
    const items = FOOD_DATA.map((f, i) => ({...f, idx: i})).filter(f => f.cat === cat);
    tbody.innerHTML = '';
    items.forEach(f => {
      const qty = selections[m][f.idx];
      const sel = qty > 0;
      const tr = document.createElement('tr');
      tr.className = (sel ? 'sel-row ' : '') + (f.neu ? 'neu-item' : '');
      tr.setAttribute('data-food-idx', f.idx);
      tr.innerHTML = `
        <td><input type="checkbox" class="form-check-input" ${sel ? 'checked' : ''}
          onchange="toggleItem(${f.idx},this)"></td>
        <td>${f.name}${f.neu ? '<span class="neu-badge">NEU</span>' : ''}</td>
        <td style="color:#9ca3af;font-size:0.8rem">${f.port}</td>
        <td class="kcal-col">${f.kcal}</td>
        <td class="prot-col">${f.p} g</td>
        <td class="kh-col">${f.kh} g</td>
        <td>
          <div class="qty-ctrl" id="qc${m}_${f.idx}"
            style="${sel ? '' : 'opacity:.3;pointer-events:none'}">
            <button class="qty-btn" onclick="changeQty(${f.idx},-0.25)">−</button>
            <input type="text" class="qty-val" id="qv${m}_${f.idx}" value="${fmtQty(qty||1)}"
              onchange="setQtyManual(${f.idx},this.value)" onblur="setQtyManual(${f.idx},this.value)">
            <button class="qty-btn" onclick="changeQty(${f.idx},+0.25)">+</button>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  });
}

// ═══════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════
function toggleItem(idx, cb) {
  const m = activeMeal;
  selections[m][idx] = cb.checked ? 1 : 0;
  const tr = cb.closest('tr');
  const f = FOOD_DATA[idx];
  tr.className = (cb.checked ? 'sel-row ' : '') + (f.neu ? 'neu-item' : '');
  const qc = document.getElementById(`qc${m}_${idx}`);
  if (qc) { qc.style.opacity = cb.checked ? '1' : '0.3'; qc.style.pointerEvents = cb.checked ? 'auto' : 'none'; }
  updateAll();
}

function fmtQty(q) {
  // Show as fraction if not whole number: 0.25→¼, 0.5→½, 0.75→¾, else as number
  const frac = {0.25:'¼', 0.5:'½', 0.75:'¾'};
  const dec = Math.round((q % 1) * 100) / 100;
  const whole = Math.floor(q);
  if (dec === 0) return `${whole}`;
  if (whole === 0) return frac[dec] || q.toFixed(2);
  return `${whole}${frac[dec] || '+'+dec}`;
}

function parseQtyInput(val) {
  const v = val.trim().replace(',', '.');
  const fracs = {'1/4':0.25,'1/2':0.5,'3/4':0.75,'¼':0.25,'½':0.5,'¾':0.75};
  if (fracs[v] !== undefined) return fracs[v];
  // Handle "1¼", "1½", "1¾", "2½" etc.
  for (const [f, n] of Object.entries(fracs)) {
    const m = v.match(new RegExp('^(\\d+)' + f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '$'));
    if (m) return parseInt(m[1]) + n;
  }
  const num = parseFloat(v);
  return isNaN(num) ? null : num;
}

function setQtyManual(idx, val) {
  const m = activeMeal;
  if (!selections[m][idx]) return;
  const parsed = parseQtyInput(val);
  if (parsed === null || parsed <= 0) {
    // reset to current value
    const qv = document.getElementById(`qv${m}_${idx}`);
    if (qv) qv.value = fmtQty(selections[m][idx]);
    return;
  }
  selections[m][idx] = Math.round(Math.min(20, Math.max(0.25, Math.round(parsed*4)/4)) * 100) / 100;
  const qv = document.getElementById(`qv${m}_${idx}`);
  if (qv) qv.value = fmtQty(selections[m][idx]);
  updateAll();
}

function changeQty(idx, delta) {
  const m = activeMeal;
  if (!selections[m][idx]) return;
  selections[m][idx] = Math.round((Math.max(0.25, Math.min(20, selections[m][idx] + delta))) * 100) / 100;
  const qv = document.getElementById(`qv${m}_${idx}`);
  if (qv) qv.value = fmtQty(selections[m][idx]);
  updateAll();
}

function switchTab(tab, el) {
  activeMeal = tab;
  document.querySelectorAll('.meal-tabs .nav-link').forEach(l => l.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('mealPane').style.display    = tab < 3 ? '' : 'none';
  document.getElementById('overviewPane').style.display = tab === 3 ? '' : 'none';
  if (tab < 3) {
    document.getElementById('clearMealBtn').textContent = `${MEAL_NAMES[tab]} leeren`;
    document.getElementById('searchInput').value = '';
    filterItems();
    renderRows();
  } else {
    renderOverview();
  }
}

function filterItems() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('tr[data-food-idx]').forEach(tr => {
    const idx = parseInt(tr.getAttribute('data-food-idx'));
    const f = FOOD_DATA[idx];
    const match = !q || f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q);
    tr.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('searchInfo').textContent =
    q ? `${visible} Treffer` : `${FOOD_DATA.length} Artikel`;
  // show/hide category blocks if all items hidden
  CATEGORIES.forEach((cat, ci) => {
    const rows = document.querySelectorAll(`#catrows${ci} tr[data-food-idx]`);
    const anyVisible = [...rows].some(r => r.style.display !== 'none');
    const block = document.querySelector(`[data-cat-block="${ci}"]`);
    if (block) block.style.display = anyVisible ? '' : 'none';
  });
}

function clearCurrentMeal() {
  const m = activeMeal;
  if (m >= 3) return;
  selections[m].fill(0);
  renderRows();
  updateAll();
}

function clearAllMeals() {
  selections.forEach(s => s.fill(0));
  if (activeMeal < 3) renderRows();
  else renderOverview();
  updateAll();
}

// ═══════════════════════════════════════════
// SUMMARY
// ═══════════════════════════════════════════
function calcMeal(m) {
  let kcal=0, p=0, kh=0, cnt=0;
  selections[m].forEach((qty, i) => {
    if (qty > 0) { kcal += FOOD_DATA[i].kcal*qty; p += FOOD_DATA[i].p*qty; kh += FOOD_DATA[i].kh*qty; cnt++; }
  });
  return {kcal, p, kh, cnt};
}

function updateAll() {
  const totals = [0,1,2].map(calcMeal);
  totals.forEach((t, m) => {
    document.getElementById(`s${m}_kcal`).textContent = Math.round(t.kcal) + ' kcal';
    document.getElementById(`s${m}_p`).textContent  = t.p.toFixed(1) + 'g';
    document.getElementById(`s${m}_kh`).textContent = t.kh.toFixed(1) + 'g';
    document.getElementById(`cnt${m}`).textContent  = t.cnt;
  });
  const gk = totals.reduce((a,t)=>a+t.kcal,0);
  const gp = totals.reduce((a,t)=>a+t.p,0);
  const gh = totals.reduce((a,t)=>a+t.kh,0);
  document.getElementById('sg_kcal').textContent = Math.round(gk) + ' kcal';
  document.getElementById('sg_p').textContent    = gp.toFixed(1) + 'g';
  document.getElementById('sg_kh').textContent   = gh.toFixed(1) + 'g';

  // Progress bars
  const zk = parseFloat(document.getElementById('ziel_kcal')?.value) || 0;
  const zp = parseFloat(document.getElementById('ziel_prot')?.value) || 0;
  function setProg(barId, pctId, ist, ziel) {
    const pct = ziel > 0 ? Math.round(ist / ziel * 100) : 0;
    const w = ziel > 0 ? Math.min(100, pct) : 0;
    const color = pct >= 100 ? '#4ade80' : pct >= 75 ? '#fde68a' : '#f87171';
    document.getElementById(barId).style.width = w + '%';
    document.getElementById(barId).style.background = color;
    document.getElementById(pctId).textContent = ziel > 0 ? pct + '%' : '—';
  }
  setProg('pb_kcal', 'pct_kcal', gk, zk);
  setProg('pb_p',    'pct_p',    gp, zp);

  if (activeMeal === 3) renderOverview();
}

// ═══════════════════════════════════════════
// OVERVIEW
// ═══════════════════════════════════════════
function renderOverview() {
  [0,1,2].forEach(m => {
    const t = calcMeal(m);
    const el = document.getElementById(`ov${m}`);
    const selected = selections[m].map((qty,i)=>({...FOOD_DATA[i],idx:i,qty})).filter(f=>f.qty>0);
    if (selected.length === 0) {
      el.innerHTML = `<div class="empty-meal">Keine Speisen ausgewählt</div>`;
    } else {
      const rows = selected.map(f => {
        const tk = f.kcal * f.qty, tp = f.p * f.qty, tkh = f.kh * f.qty;
        const qtyStr = f.qty !== 1 ? `<span class="ov-qty">×${fmtQty(f.qty)}</span>` : '';
        return `<div class="ov-item">
          <span class="ov-name">${f.name}${f.neu ? '<span class="neu-badge ms-1">NEU</span>' : ''}${qtyStr}</span>
          <span class="ov-kcal">${Math.round(tk)} kcal &nbsp;
            <span style="color:var(--blue-dark)">${tp.toFixed(1)} g P</span></span>
        </div>`;
      }).join('');
      el.innerHTML = rows + `
        <div class="overview-total">
          <span>${Math.round(t.kcal)} kcal</span>
          <span style="color:var(--blue-dark)">${t.p.toFixed(1)} g P</span>
          <span style="color:var(--teal)">${t.kh.toFixed(1)} g KH</span>
          <span style="color:#6b7280;margin-left:auto">${t.cnt} Pos.</span>
        </div>`;
    }
  });
}

// ═══════════════════════════════════════════
// PDF EXPORT
// ═══════════════════════════════════════════
function exportPDF() {
  const allSelected = [0,1,2].some(m => selections[m].some(q => q > 0));
  if (!allSelected) { alert('Bitte wählen Sie zuerst Speisen aus.'); return; }

  const { jsPDF } = window.jspdf;
  // A4 Querformat: 297 × 210 mm
  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });

  const vorname  = document.getElementById('pat_vorname').value.trim();
  const nachname = document.getElementById('pat_nachname').value.trim();
  const geburt   = document.getElementById('pat_geburt').value;
  const kostform = document.getElementById('pat_kostform').value;
  const zk = parseFloat(document.getElementById('ziel_kcal').value) || 0;
  const zp = parseFloat(document.getElementById('ziel_prot').value) || 0;
  const today = new Date().toLocaleDateString('de-CH');

  // === Farben (Farbwelt) ===
  const C_DARK  = [58, 82, 98];    // #3a5262 Pantone 7699 dunkel
  const C_MID   = [94, 118, 136];  // #5e7688 Pantone 7699
  const C_LIGHT = [220, 229, 234]; // hell
  const C_MEAL  = [[58,82,98],[107,138,128],[154,120,96]]; // Frühstück/Mittag/Abend
  const C_MLIGHT= [[220,229,234],[220,232,228],[240,230,222]];
  const C_YEL   = [239,218,143]; // #efda8f Pantone 4001
  const C_WARM  = [220,215,210]; // #dcd7d2 Pantone 7527
  const LABELS  = ['Frühstück','Mittagessen','Abendessen'];

  // === Header ===
  const hasPatient = vorname||nachname||geburt||kostform||zk||zp;
  const headerH = hasPatient ? 28 : 18;
  doc.setFillColor(...C_DARK);
  doc.rect(0, 0, 297, headerH, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.text('Zufuhrberechner Stationär – ASM', 14, 9);
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(`Nährwertauswertung  |  Datum: ${today}`, 14, 15);
  if (hasPatient) {
    const patName = [vorname, nachname].filter(Boolean).join(' ') || '—';
    const geburtFmt = geburt ? new Date(geburt).toLocaleDateString('de-CH') : '';
    const parts = [];
    if (patName !== '—') parts.push(`Patient: ${patName}`);
    if (geburtFmt) parts.push(`Geb.: ${geburtFmt}`);
    if (kostform) parts.push(`Kostform: ${kostform}`);
    if (zk) parts.push(`Ziel Energie: ${zk} kcal`);
    if (zp) parts.push(`Ziel Protein: ${zp} g`);
    doc.setFontSize(8.5);
    doc.text(parts.join('   |   '), 14, 23);
  }

  // === 3 Spalten nebeneinander ===
  const startY = headerH + 5;
  // 3 gleiche Spalten: je 85mm, Abstände 5mm, ab x=14
  const colW = 85;
  const colX = [14, 105, 196];
  const grandTotals = {kcal:0, p:0, kh:0};
  const finalYs = [startY, startY, startY];

  [0,1,2].forEach(m => {
    const sel = selections[m].map((qty,i)=>({...FOOD_DATA[i],idx:i,qty})).filter(f=>f.qty>0);
    const t = calcMeal(m);
    grandTotals.kcal += t.kcal; grandTotals.p += t.p; grandTotals.kh += t.kh;

    const rows = [];
    // Titel-Zeile (colSpan:5)
    rows.push([{content: LABELS[m], colSpan:5, styles:{
      fillColor:C_MEAL[m], textColor:[255,255,255],
      fontStyle:'bold', fontSize:10,
      cellPadding:{top:3,bottom:3,left:3,right:3}
    }}]);
    // Spalten-Header (5 Spalten)
    rows.push([
      {content:'Speise', styles:{fontStyle:'bold', fillColor:C_WARM, textColor:[50,50,50], fontSize:7.5}},
      {content:'Anz.',   styles:{fontStyle:'bold', fillColor:C_WARM, textColor:[50,50,50], fontSize:7.5, halign:'center'}},
      {content:'kcal',   styles:{fontStyle:'bold', fillColor:C_WARM, textColor:[138,106,80], fontSize:7.5, halign:'right'}},
      {content:'P g',    styles:{fontStyle:'bold', fillColor:C_WARM, textColor:[58,82,98], fontSize:7.5, halign:'right'}},
      {content:'KH g',   styles:{fontStyle:'bold', fillColor:C_WARM, textColor:[107,138,128], fontSize:7.5, halign:'right'}},
    ]);
    if (sel.length === 0) {
      rows.push([{content:'Keine Auswahl', colSpan:5,
        styles:{textColor:[170,170,170], fontStyle:'italic', fontSize:7.5}}]);
    } else {
      sel.forEach(f => {
        const tk = f.kcal*f.qty, tp = f.p*f.qty, tkh = f.kh*f.qty;
        rows.push([
          f.name + (f.neu ? ' *' : ''),
          fmtQty(f.qty),
          f.qty !== 1 ? `${Math.round(tk)}` : `${f.kcal}`,
          (f.qty !== 1 ? tp : f.p).toFixed(1),
          (f.qty !== 1 ? tkh : f.kh).toFixed(1),
        ]);
      });
    }
    // Total-Zeile (colSpan:2 für Name+Anz)
    rows.push([
      {content:'Total', colSpan:2,
       styles:{fontStyle:'bold', fillColor:C_MEAL[m], textColor:[255,255,255], fontSize:8.5}},
      {content:`${Math.round(t.kcal)}`,
       styles:{fontStyle:'bold', fillColor:C_MEAL[m], textColor:C_YEL, halign:'right', fontSize:8.5}},
      {content:`${t.p.toFixed(1)}`,
       styles:{fontStyle:'bold', fillColor:C_MEAL[m], textColor:[210,225,230], halign:'right', fontSize:8.5}},
      {content:`${t.kh.toFixed(1)}`,
       styles:{fontStyle:'bold', fillColor:C_MEAL[m], textColor:[210,225,230], halign:'right', fontSize:8.5}},
    ]);

    doc.autoTable({
      startY: startY,
      margin: {left: colX[m], right: 297 - colX[m] - colW},
      tableWidth: colW,
      head: [],
      body: rows,
      styles: {fontSize:8, cellPadding:1.8, overflow:'ellipsize'},
      columnStyles: {
        0:{cellWidth:37},
        1:{cellWidth:6, halign:'center'},
        2:{cellWidth:14, halign:'right'},
        3:{cellWidth:14, halign:'right'},
        4:{cellWidth:14, halign:'right'},
      },
      alternateRowStyles: {fillColor: C_MLIGHT[m]},
      didDrawPage: (data) => {
        doc.setFontSize(7); doc.setTextColor(160);
        doc.text(`Seite ${data.pageNumber}`, 283, 206, {align:'right'});
      }
    });
    finalYs[m] = doc.lastAutoTable.finalY;
  });

  // === Gesamt-Total ===
  const totalY = Math.max(...finalYs) + 6;
  if (totalY < 198) {
    const hasT = zk > 0 || zp > 0;
    const boxH = hasT ? 16 : 11;
    doc.setFillColor(...C_DARK);
    doc.roundedRect(14, totalY, 269, boxH, 2, 2, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    doc.text('TAGESGESAMTTOTAL', 18, totalY+7);
    doc.setFontSize(11);
    const pctK = zk > 0 ? ` (${Math.round(grandTotals.kcal/zk*100)}%)` : '';
    const pctP = zp > 0 ? ` (${Math.round(grandTotals.p/zp*100)}%)` : '';
    const totalLine = `${Math.round(grandTotals.kcal)} kcal${pctK}  |  ${grandTotals.p.toFixed(1)} g Protein${pctP}  |  ${grandTotals.kh.toFixed(1)} g KH`;
    doc.text(totalLine, 70, totalY+7);
    if (hasT) {
      const z = [];
      if (zk) z.push(`Ziel Energie: ${zk} kcal`);
      if (zp) z.push(`Ziel Protein: ${zp} g`);
      doc.setFontSize(7.5); doc.setFont('helvetica','normal');
      doc.setTextColor(...C_YEL);
      if (z.length) doc.text(z.join('   |   '), 18, totalY+13);
    }
  }

  doc.save(`Zufuhrberechnung_${today.replace(/\./g,'')}.pdf`);
}

document.getElementById('searchInfo').textContent = `${FOOD_DATA.length} Artikel`;
document.getElementById('clearMealBtn').textContent = `${MEAL_NAMES[0]} leeren`;
updateAll();
</script>
